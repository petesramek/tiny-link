[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -pedantic
    -I src
    -D TINYLINK_NATIVE_TEST

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
