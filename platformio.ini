[platformio]
default_envs = native
test_dir = test/suites

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -pedantic
    -I src
    -I test
    -I test/support/stubs/arduino
    -I test/support/stubs/espidf
    -I test/support/stubs/stm32
    -I test/support/stubs/windows
    -D TINYLINK_NATIVE_TEST

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=undefined
